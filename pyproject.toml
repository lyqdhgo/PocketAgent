[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketagent"
version = "0.1.0"
description = "PocketAgent —— 面试展示级的多智能体（Agent）项目：自研 ReAct 工具调用循环 + Planner/Worker/Reporter 团队编排，兼容 DeepSeek / OpenAI / Ollama"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PocketAgent Contributors" }]
keywords = ["agent", "llm", "react", "tool-calling", "multi-agent", "deepseek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
gui = ["gradio>=6.0"]
wiki = ["wikipedia>=1.4"]

[tool.setuptools.packages.find]
include = ["pocketagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
